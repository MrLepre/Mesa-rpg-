<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Elarion — Ficha Completa</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=EB+Garamond:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#09080b;--panel:#17121b;--panel2:#0e0b12;--gold:#c89b3c;--gold2:#f0cf78;--violet:#9d6cff;--text:#eee4d2;--muted:#aaa0b1;--line:#49372a;--ok:#9fe0b4;--danger:#e99595}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;padding:12px;background:radial-gradient(circle at 50% 0,#302039 0,var(--bg) 62%);color:var(--text);font-family:'EB Garamond',serif}.ficha{max-width:1180px;margin:auto;background:rgba(15,12,19,.98);border:2px solid var(--gold);border-radius:10px;padding:18px;box-shadow:0 0 35px #000}.top{text-align:center;border-bottom:1px solid var(--gold);padding-bottom:12px;margin-bottom:12px}.top h1{font-family:Cinzel;color:var(--gold2);margin:0;font-size:2rem}.top p{margin:5px;color:#d7b66a}.tabs{position:sticky;top:0;z-index:20;display:flex;gap:6px;overflow:auto;padding:7px 0;background:rgba(15,12,19,.97);border-bottom:1px solid #392b21;margin-bottom:14px}.tabs button{white-space:nowrap}.tab-btn.active{background:#4a3515;border-color:var(--gold2)}.tab-pane{display:none}.tab-pane.active{display:block}.bloco{border:1px solid var(--line);border-radius:7px;background:linear-gradient(135deg,#1b1521,#100d14);padding:13px;margin-bottom:13px}.bloco h2{font-family:Cinzel;color:var(--gold2);font-size:1.05rem;border-bottom:1px solid var(--line);padding-bottom:7px;margin:0 0 11px}.grid{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:9px}.campo{min-width:0}.campo label,.field-title{display:block;color:#e5c77e;font-weight:600;margin-bottom:4px}.campo input,.campo select,.campo textarea,.joia input,.joia select,.habilidade input,.habilidade textarea,.habilidade select{width:100%;padding:8px;background:#09080c;color:#f4f0e9;border:1px solid #4b3c2c;border-radius:4px;font:inherit}.campo textarea,.habilidade textarea{resize:vertical}.campo input:focus,.campo select:focus,.campo textarea:focus,.joia input:focus,.joia select:focus,.habilidade input:focus,.habilidade textarea:focus,.habilidade select:focus{outline:none;border-color:var(--gold2);box-shadow:0 0 7px #c89b3c33}.attr-card{border:1px solid #4b3c2c;border-radius:7px;background:#0c0a0f;padding:9px}.attr-card .row{display:grid;grid-template-columns:1fr 78px 68px;gap:5px;align-items:end}.attr-card input{text-align:center;font-weight:700}.mod-box{text-align:center;color:var(--gold2);font-weight:700;padding:8px 4px;border:1px solid #403326;border-radius:4px;background:#121017}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.stat{padding:10px;border:1px solid #4b3c2c;border-radius:6px;text-align:center;background:#0c0a0f}.stat span{display:block;color:var(--muted);font-size:.8rem}.stat strong{font-size:1.4rem;color:var(--gold2)}.btn{background:#21190e;color:var(--gold2);border:1px solid var(--gold);border-radius:5px;padding:8px 11px;font-weight:700;cursor:pointer}.btn:hover{filter:brightness(1.15)}.btn-danger{border-color:#8c4545;color:#ffb1a9;background:#211010}.btn-small{padding:6px 8px;font-size:.9rem}.acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.nota{padding:9px 11px;border-left:3px solid var(--violet);background:#120e19;color:#cfc5d7;border-radius:4px}.sem-limite{color:var(--ok);font-weight:700}.muted{color:var(--muted)}.ok{color:var(--ok)}.danger{color:var(--danger)}.pills{display:flex;gap:7px;flex-wrap:wrap}.pill{border:1px solid #55432e;border-radius:999px;padding:5px 9px;background:#0d0a10;color:#dbc58e}.joias,.habilidades{display:grid;gap:9px}.joia,.habilidade{border:1px solid #4b3c2c;border-radius:6px;padding:10px;background:#0c0a0f}.joia{display:grid;grid-template-columns:1.2fr .8fr .8fr 1fr 1.7fr auto;gap:6px;align-items:end}.joia label,.habilidade label{font-size:.72rem;color:var(--muted);display:block;margin-bottom:3px}.wide{grid-column:span 1}.habilidade{display:grid;grid-template-columns:1fr .8fr .7fr 2fr auto;gap:7px;align-items:end}.resource-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}.resource-box{padding:10px;border:1px solid #4b3c2c;border-radius:7px;background:#0c0a0f}.resource-box h3{margin:0 0 7px;color:var(--gold2);font-family:Cinzel;font-size:.9rem}.resource-controls{display:grid;grid-template-columns:1fr 1fr;gap:6px}.resource-controls input{width:100%;padding:8px;background:#09080c;color:#fff;border:1px solid #403326;border-radius:4px}.roll-grid{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:end}.resultado{min-height:45px;margin-top:9px;padding:10px;border:1px solid #4b3c2c;border-radius:6px;background:#0b090e}.progress{height:10px;background:#0b090e;border:1px solid #403326;border-radius:99px;overflow:hidden}.progress>div{height:100%;background:var(--gold);width:0}.level-table{width:100%;border-collapse:collapse;font-size:.9rem}.level-table th,.level-table td{border:1px solid #403326;padding:6px;text-align:center}.level-table th{color:var(--gold2);background:#161018}.inventory{display:grid;gap:7px}.item-row{display:grid;grid-template-columns:1.2fr .8fr 2fr auto;gap:6px}.checkgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.checkrow{display:flex;gap:8px;align-items:center;padding:8px;background:#0b090e;border:1px solid #403326;border-radius:4px}.checkrow input{width:auto}.hidden{display:none!important}@media(max-width:900px){.cards{grid-template-columns:repeat(3,1fr)}.joia{grid-template-columns:1fr 1fr 1fr}.habilidade{grid-template-columns:1fr 1fr}.resource-row{grid-template-columns:1fr}.roll-grid{grid-template-columns:1fr 1fr}.checkgrid{grid-template-columns:1fr 1fr}}@media(max-width:560px){body{padding:5px}.ficha{padding:9px}.top h1{font-size:1.35rem}.tabs{top:0}.grid{grid-template-columns:1fr!important}.cards{grid-template-columns:1fr 1fr}.attr-card .row{grid-template-columns:1fr 68px 60px}.joia,.habilidade,.item-row{grid-template-columns:1fr}.roll-grid{grid-template-columns:1fr}.checkgrid{grid-template-columns:1fr}.acoes .btn{width:100%}}
@media print{body{background:#fff;color:#111;padding:0}.ficha{border:0;box-shadow:none;max-width:none;background:#fff}.tabs,.acoes,.btn{display:none!important}.tab-pane{display:block!important}.bloco{break-inside:avoid;background:#fff;border-color:#aaa}.campo input,.campo select,.campo textarea,.joia input,.joia select,.habilidade input,.habilidade textarea,.habilidade select{color:#111;background:#fff;border-color:#aaa}.top h1,.bloco h2,.campo label,.field-title{color:#5d4411}}
</style>
</head>
<body>
<div class="ficha">
<div class="top"><h1>💎 Elarion — Sistema de Joias e Luvas</h1><p id="subtitulo">Ficha completa de personagem</p></div>
<nav class="tabs" id="tabs"></nav>
<div id="conteudo">Carregando...</div>
<div class="acoes"><button class="btn" type="button" onclick="enviar()">⚔️ Enviar para a Mesa</button><button class="btn" type="button" onclick="salvarLocal()">💾 Salvar rascunho</button><button class="btn" type="button" onclick="carregarLocal()">↩️ Recuperar rascunho</button><button class="btn" type="button" onclick="window.print()">📜 Imprimir / PDF</button></div>
</div>
<script>
let sistema=null,config={},modo='criacao',dados={};
const CLASSES=['Espadachim Rúnico','Guardião Prismático','Arqueiro Elemental','Teurgo Cristalino','Sombra Lapidada','Berserker do Núcleo','Bardo da Inspiração','Místico Mentalista'];
const PORTADORES=['Punho Elemental','Condutor do Núcleo','Avatar do Vazio','Mestre da Luz Interior','Punho da Ruína','Tecedor Temporal'];
const RACAS=['Humano','Elfo','Orc','Khajiit','Lizardmen','Anões','Povo-Fera'];
const ATTR=[['FOR','Força'],['CON','Constituição'],['AGI','Agilidade'],['VON','Vontade'],['INT','Inteligência'],['CAR','Carisma'],['PER','Percepção'],['FÉ','Fé']];
const XP=[0,100,300,600,1000,1500,2100,2800,3600,4500,5500,6600,7800,9100,10500,12000,13600,15300,17100,19000];
const TABS=[['identidade','📜 Identidade'],['atributos','🛡️ Atributos'],['recursos','❤️ Recursos'],['luva','🧤 Luva'],['joias','💠 Joias'],['criar_joia','🔨 Criar Joia'],['habilidades','✨ Habilidades'],['progressao','📈 Progressão'],['inventario','🎒 Inventário'],['historia','📖 História']];
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function num(v,d=0){const x=Number(v);return Number.isFinite(x)?x:d}
function attrKey(a){return 'attr_'+a}
function getAttr(a){return num(document.getElementById(attrKey(a))?.value,dados[attrKey(a)]??1)}
function modAttr(v){v=num(v,1);if(v<=1)return -2;if(v===2)return -1;if(v===3)return 0;if(v===4)return 1;if(v===5)return 2;if(v===6)return 3;if(v===7)return 4;return 5}
function renderTabs(){document.getElementById('tabs').innerHTML=TABS.map(([id,t],i)=>`<button type="button" class="btn btn-small tab-btn ${i===0?'active':''}" data-tab="${id}">${t}</button>`).join('');document.querySelectorAll('.tab-btn').forEach(b=>b.onclick=()=>abrirAba(b.dataset.tab))}
function abrirAba(id){document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));document.querySelectorAll('.tab-pane').forEach(p=>p.classList.toggle('active',p.id==='tab_'+id));localStorage.setItem('elarion_ultima_aba',id);window.scrollTo({top:0,behavior:'smooth'})}
function optionList(arr,sel,placeholder='Selecione'){return `<option value="">${placeholder}</option>`+arr.map(x=>`<option value="${esc(x)}" ${sel===x?'selected':''}>${esc(x)}</option>`).join('')}
function render(){renderTabs();document.getElementById('subtitulo').textContent=(sistema?.descricao||'Sistema de Joias e Luvas')+(modo==='edicao'?' — edição':'');
const attrs=ATTR.map(([a,nome])=>`<div class="attr-card"><div class="field-title">${nome} <span class="muted">(${a})</span></div><div class="row"><input id="attr_${a}" type="number" min="1" max="99" value="${esc(dados[attrKey(a)]??1)}"><div class="mod-box" id="mod_${a}">+0</div><button type="button" class="btn btn-small" onclick="rolarTeste('${a}')">🎲</button></div></div>`).join('');
const joias=Array.isArray(dados.joias)?dados.joias:[];const habilidades=Array.isArray(dados.habilidades_lista)?dados.habilidades_lista:[];const inventario=Array.isArray(dados.inventario)?dados.inventario:[];
document.getElementById('conteudo').innerHTML=`
<section class="tab-pane active" id="tab_identidade">
<div class="bloco"><h2>📜 Identidade</h2><div class="grid" style="--cols:3">
<div class="campo"><label>Nome</label><input id="nome" value="${esc(dados.nome||'')}"></div>
<div class="campo"><label>Raça</label><select id="raca">${optionList(RACAS,dados.raca)}</select></div>
<div class="campo"><label>Classe</label><select id="classe">${optionList(CLASSES,dados.classe)}</select></div>
<div class="campo"><label>Portador Puro</label><select id="portador_puro">${optionList(PORTADORES,dados.portador_puro,'Nenhum')}</select></div>
<div class="campo"><label>Subclasse / Caminho</label><input id="subclasse" value="${esc(dados.subclasse||'')}"></div>
<div class="campo"><label>Nível</label><input id="nivel" type="number" min="1" max="20" value="${esc(dados.nivel||1)}"></div>
<div class="campo"><label>XP atual</label><input id="xp_atual" type="number" min="0" value="${esc(dados.xp_atual||0)}"></div>
<div class="campo"><label>Jogador</label><input id="jogador" value="${esc(dados.jogador||'')}"></div>
<div class="campo"><label>Título / Epíteto</label><input id="titulo" value="${esc(dados.titulo||'')}"></div>
</div><div class="nota" id="nivel_info"></div></div>
<div class="bloco"><h2>🧬 Características de Raça e Classe</h2><div class="grid" style="--cols:2"><div class="campo"><label>Bônus / características raciais</label><textarea id="caracteristicas_raciais" rows="5">${esc(dados.caracteristicas_raciais||'')}</textarea></div><div class="campo"><label>Características de classe / caminho</label><textarea id="caracteristicas_classe" rows="5">${esc(dados.caracteristicas_classe||'')}</textarea></div></div><div class="nota muted">Os campos permitem registrar exatamente as características definidas pelo Mestre sem inventar regras não cadastradas no sistema.</div></div>
</section>
<section class="tab-pane" id="tab_atributos"><div class="bloco"><h2>🛡️ Atributos</h2><div class="grid" style="--cols:4">${attrs}</div><div class="nota">Criação: 1 ponto base em cada atributo + 12 pontos livres. O teto inicial é 5 antes de bônus. O modificador automático segue: 1=-2, 2=-1, 3=0, 4=+1, 5=+2, 6=+3, 7=+4, 8+=+5.</div><div class="grid" style="--cols:2;margin-top:10px"><div class="campo"><label>Distribuição inicial / evolução</label><textarea id="distribuicao_atributos" rows="4">${esc(dados.distribuicao_atributos||'')}</textarea></div><div class="campo"><label>Bônus temporários / permanentes</label><textarea id="bonus_atributos" rows="4">${esc(dados.bonus_atributos||'')}</textarea></div></div></div></section>
<section class="tab-pane" id="tab_recursos"><div class="bloco"><h2>❤️ Recursos</h2><div class="cards"><div class="stat"><span>PV Máximo</span><strong id="pv_calc">—</strong></div><div class="stat"><span>PF / Fadiga</span><strong id="pf_calc">—</strong></div><div class="stat"><span>TF</span><strong id="tf_calc">—</strong></div><div class="stat"><span>Defesa</span><strong id="def_calc">—</strong></div><div class="stat"><span>Inspiração</span><strong id="insp_calc">0/3</strong></div></div><div class="resource-row" style="margin-top:10px"><div class="resource-box"><h3>❤️ Vida</h3><div class="resource-controls"><input id="vida_atual" type="number" placeholder="Atual" value="${esc(dados.vida_atual??'')}"><input id="vida_max" type="number" placeholder="Máximo" value="${esc(dados.vida_max??'')}"></div></div><div class="resource-box"><h3>🔥 Fadiga</h3><div class="resource-controls"><input id="pf_atual" type="number" placeholder="PF atual" value="${esc(dados.pf_atual??'')}"><input id="pf_max" type="number" placeholder="PF máximo" value="${esc(dados.pf_max??'')}"></div></div><div class="resource-box"><h3>🛡️ Defesa</h3><div class="resource-controls"><input id="defesa" type="number" placeholder="Valor" value="${esc(dados.defesa??'')}"><input id="defesa_bonus" type="number" placeholder="Bônus" value="${esc(dados.defesa_bonus??0)}"></div></div></div></div>
<div class="bloco"><h2>🐺 Vontade Bestial</h2><div class="grid" style="--cols:3"><div class="checkrow"><input id="bestial_ativa" type="checkbox" ${dados.bestial_ativa?'checked':''}><label for="bestial_ativa">Ativa</label></div><div class="campo"><label>Estado</label><select id="vontade_bestial"><option>Não</option><option>Desperta</option><option>Controlada</option><option>Natural e Integrada</option></select></div><div class="campo"><label>CD do teste</label><input id="bestial_cd" type="number" value="${esc(dados.bestial_cd??10)}"></div></div><div class="acoes"><button type="button" class="btn" onclick="usarVontadeBestial()">🐺 Testar Vontade Bestial</button></div><div id="bestial_resultado" class="resultado"></div></div>
<div class="bloco"><h2>❤️ Dados de Coração</h2><div class="grid" style="--cols:3"><div class="campo"><label>Dados restantes</label><input id="dados_coracao" type="number" min="0" max="3" value="${esc(dados.dados_coracao??3)}"></div><div class="campo"><label>CD do Mestre</label><input id="coracao_cd" type="number" value="${esc(dados.coracao_cd??15)}"></div><div class="campo"><label>Motivo / feito impossível</label><input id="coracao_motivo" value="${esc(dados.coracao_motivo||'')}"></div></div><button type="button" class="btn" onclick="rolarCoracao()">❤️ Rolar 1d12 — Teste do Coração</button><div id="coracao_resultado" class="resultado"></div></div>
<div class="bloco"><h2>✨ Inspiração</h2><div class="pills"><span class="pill">1 ponto: rerrolar</span><span class="pill">1 ponto: +2 no teste</span><span class="pill">1 ponto: vantagem narrativa</span><span class="pill">1 ponto: ação fora da ordem</span><span class="pill">3 pontos: efeito heroico / ação extra (1x/sessão)</span></div><div class="grid" style="--cols:2;margin-top:9px"><div class="campo"><label>Inspiração atual (0–3)</label><input id="inspiracao" type="number" min="0" max="3" value="${esc(dados.inspiracao??0)}"></div><div class="campo"><label>Registro de uso</label><textarea id="historico_inspiracao" rows="3">${esc(dados.historico_inspiracao||'')}</textarea></div></div><div class="acoes"><button type="button" class="btn" onclick="gastarInspiracao(1)">−1 Inspiração</button><button type="button" class="btn" onclick="gastarInspiracao(3)">−3 Inspiração</button><button type="button" class="btn" onclick="ganharInspiracao()">＋1 Inspiração</button></div></div></section>
<section class="tab-pane" id="tab_luva"><div class="bloco"><h2>🧤 Luva de Canalização</h2><div class="grid" style="--cols:4"><div class="campo"><label>Rank</label><select id="luva_rank"><option>Bronze</option><option>Silver</option><option>Gold</option><option>Mythic</option></select></div><div class="campo"><label>Estágio</label><select id="luva_estagio"><option>1 — Inicial</option><option>2 — Intermediária</option><option>3 — Avançada</option></select></div><div class="campo"><label>Nome da Luva</label><input id="luva_nome" value="${esc(dados.luva_nome||'')}"></div><div class="campo"><label>Forma / versão</label><input id="luva_forma" value="${esc(dados.luva_forma||'')}" placeholder="Ex.: Fase 2.0"></div></div><div class="grid" style="--cols:2;margin-top:9px"><div class="campo"><label>Estilo de luta</label><input id="estilo_luta" value="${esc(dados.estilo_luta||'')}"></div><div class="campo"><label>Atributo dominante</label><select id="atributo_dominante">${optionList(ATTR.map(x=>x[0]),dados.atributo_dominante,'Nenhum')}</select></div><div class="campo"><label>Gatilho narrativo da evolução</label><textarea id="gatilho_evolucao" rows="4">${esc(dados.gatilho_evolucao||'')}</textarea></div><div class="campo"><label>Condição para próxima evolução</label><textarea id="condicao_evolucao" rows="4">${esc(dados.condicao_evolucao||'')}</textarea></div><div class="campo"><label>Aparência / descrição</label><textarea id="luva_aparencia" rows="5">${esc(dados.luva_aparencia||'')}</textarea></div><div class="campo"><label>Histórico de evolução</label><textarea id="luva_historico" rows="5">${esc(dados.luva_historico||'')}</textarea></div></div></div><div class="bloco"><h2>⚙️ Bônus e propriedades da Luva</h2><div class="grid" style="--cols:3"><div class="campo"><label>Bônus comum</label><input id="luva_bonus_comum" type="number" value="${esc(dados.luva_bonus_comum??0)}"></div><div class="campo"><label>Bônus Ancestral</label><input id="luva_bonus_ancestral" type="number" value="${esc(dados.luva_bonus_ancestral??0)}"></div><div class="campo"><label>Bônus Mítico</label><input id="luva_bonus_mitico" type="number" value="${esc(dados.luva_bonus_mitico??0)}"></div></div><div class="campo" style="margin-top:9px"><label>Habilidades especiais da Luva</label><textarea id="luva_habilidades" rows="7">${esc(dados.luva_habilidades||'')}</textarea></div></div></section>
<section class="tab-pane" id="tab_joias"><div class="bloco"><h2>💠 Joias</h2><p class="nota"><span class="sem-limite">∞ Inventário ilimitado.</span> Selecione a joia no catálogo ou escolha uma joia personalizada. Não há bloqueio de quantidade de joias. Registre joias na luva, fora da luva, vinculadas, ingeridas ou especiais.</p><div class="joias" id="lista-joias"></div><button type="button" class="btn" onclick="adicionarJoia()">＋ Adicionar Joia</button></div><div class="bloco"><h2>🔗 Vínculos e combinações</h2><div class="grid" style="--cols:2"><div class="campo"><label>Joias vinculadas / ingeridas</label><textarea id="joias_vinculadas" rows="5">${esc(dados.joias_vinculadas||'')}</textarea></div><div class="campo"><label>Combinações / sinergias</label><textarea id="joias_sinergias" rows="5">${esc(dados.joias_sinergias||'')}</textarea></div><div class="campo"><label>Joias corrompidas / risco de corrupção</label><textarea id="joias_corrupcao" rows="5">${esc(dados.joias_corrupcao||'')}</textarea></div><div class="campo"><label>Observações das Joias da Vontade Bestial</label><textarea id="joias_bestiais" rows="5">${esc(dados.joias_bestiais||'')}</textarea></div></div></div></section>

function opcoesJoiasSelecionaveis(valor){let html='<option value="">— Selecione uma Joia —</option>';Object.entries(CATALOGO_JOIAS).forEach(([cat,lista])=>{html+=`<optgroup label="${cat}">`;lista.forEach(nome=>{html+=`<option value="${esc(nome)}" data-categoria="${esc(cat)}">${esc(nome)}</option>`});html+='</optgroup>'});const manuais=dados.joias_personalizadas_catalogo||[];if(manuais.length){html+='<optgroup label="🛠️ Criadas manualmente">';manuais.forEach(j=>{html+=`<option value="${esc(j.nome)}" data-categoria="${esc(j.categoria||'Personalizada')}">${esc(j.nome)}</option>`});html+='</optgroup>'}if(valor && !Object.values(CATALOGO_JOIAS).flat().includes(valor))html+=`<option value="${esc(valor)}" selected>${esc(valor)} (personalizada)</option>`;return html}
function renderJoias(lista){const el=document.getElementById('lista-joias');el.innerHTML=lista.map((j,i)=>`<div class="joia"><div><label>Joia</label><select data-j="${i}" data-k="nome">${opcoesJoiasSelecionaveis(j.nome||'')}</select></div><div><label>Categoria</label><select data-j="${i}" data-k="categoria"><option>Normal</option><option>Ancestral</option><option>Mythic</option><option>Especial</option></select></div><div><label>Local</label><select data-j="${i}" data-k="local"><option>Na Luva</option><option>Fora da Luva</option><option>Ingerida</option><option>Especial</option></select></div><div><label>Tipo / afinidade</label><input data-j="${i}" data-k="tipo" value="${esc(j.tipo||'')}"></div><div><label>Efeito / bônus / habilidade</label><input data-j="${i}" data-k="efeito" value="${esc(j.efeito||'')}"></div><button class="btn btn-danger" type="button" onclick="removerJoia(${i})">✕</button></div>`).join('')||'<div class="muted">Nenhuma joia registrada. Adicione quantas quiser.</div>';lista.forEach((j,i)=>{const n=el.querySelector(`select[data-j="${i}"][data-k="nome"]`);const c=el.querySelector(`select[data-j="${i}"][data-k="categoria"]`);const l=el.querySelector(`select[data-j="${i}"][data-k="local"]`);if(n)n.value=j.nome||'';if(c)c.value=j.categoria||'Normal';if(l)l.value=j.local||'Na Luva'});el.querySelectorAll('[data-j]').forEach(x=>{x.addEventListener('input',persistirEstruturas);x.addEventListener('change',()=>{if(x.dataset.k==='nome'){const opt=x.options[x.selectedIndex];const cat=opt?.dataset?.categoria;const row=x.closest('.joia');const c=row?.querySelector('[data-k="categoria"]');if(cat&&c)c.value=cat}persistirEstruturas()})})}
function renderHabilidades(lista){const el=document.getElementById('lista-habilidades');el.innerHTML=lista.map((h,i)=>`<div class="habilidade"><div><label>Nome</label><input data-h="${i}" data-k="nome" value="${esc(h.nome||'')}"></div><div><label>Tipo</label><select data-h="${i}" data-k="tipo"><option>Ativa</option><option>Passiva</option><option>Reação</option><option>Ritual</option><option>Especial</option></select></div><div><label>Nível</label><input data-h="${i}" data-k="nivel" type="number" min="1" max="20" value="${esc(h.nivel||1)}"></div><div><label>Descrição / custo / efeito</label><textarea data-h="${i}" data-k="descricao" rows="2">${esc(h.descricao||'')}</textarea></div><button class="btn btn-danger" type="button" onclick="removerHabilidade(${i})">✕</button></div>`).join('')||'<div class="muted">Nenhuma habilidade cadastrada.</div>';lista.forEach((h,i)=>{const s=el.querySelector(`select[data-h="${i}"]`);if(s)s.value=h.tipo||'Ativa'});el.querySelectorAll('[data-h]').forEach(x=>x.addEventListener('input',persistirEstruturas))}

function criarJoiaManual(){const nome=(document.getElementById('nova_joia_nome')?.value||'').trim();if(!nome){document.getElementById('nova_joia_resultado').textContent='Informe o nome da joia.';return}const j={nome,categoria:document.getElementById('nova_joia_categoria')?.value||'Personalizada',local:document.getElementById('nova_joia_local')?.value||'Na Luva',tipo:document.getElementById('nova_joia_tipo')?.value||'',atributo:document.getElementById('nova_joia_atributo')?.value||'',bonus:num(document.getElementById('nova_joia_bonus')?.value,0),vinculo:document.getElementById('nova_joia_vinculo')?.value||'Não vinculada',ativacao:document.getElementById('nova_joia_ativacao')?.value||'Passiva',uso:document.getElementById('nova_joia_uso')?.value||'',efeito:document.getElementById('nova_joia_efeito')?.value||'',habilidades:document.getElementById('nova_joia_habilidades')?.value||'',descricao:document.getElementById('nova_joia_descricao')?.value||'',manual:true};dados.joias_personalizadas_catalogo=dados.joias_personalizadas_catalogo||[];dados.joias_personalizadas_catalogo.push(j);dados.joias=dados.joias||[];dados.joias.push({...j});persistirEstruturas();renderJoias(dados.joias);renderCatalogoManuais();document.getElementById('nova_joia_resultado').textContent=`💎 ${nome} criada e adicionada à ficha.`;['nova_joia_nome','nova_joia_tipo','nova_joia_uso','nova_joia_efeito','nova_joia_habilidades','nova_joia_descricao'].forEach(id=>{const e=document.getElementById(id);if(e)e.value=''});document.getElementById('nova_joia_bonus').value=0}

function calcular(){if(!document.getElementById('attr_CON'))return;const con=getAttr('CON'),von=getAttr('VON'),lvl=Math.min(20,Math.max(1,num(document.getElementById('nivel')?.value,1)));ATTR.forEach(([a])=>{const el=document.getElementById('mod_'+a);if(el){const m=modAttr(getAttr(a));el.textContent=m>=0?'+'+m:m}});const tf=con+von+lvl;const pf=Math.max(5,num(document.getElementById('pf_max')?.value,dados.pf_max||tf));const pv=Math.max(1,num(document.getElementById('vida_max')?.value,dados.vida_max||20+con+von));document.getElementById('tf_calc').textContent=tf;document.getElementById('pf_calc').textContent=pf;document.getElementById('pv_calc').textContent=pv;document.getElementById('def_calc').textContent=document.getElementById('defesa')?.value||'—';document.getElementById('insp_calc').textContent=(document.getElementById('inspiracao')?.value||0)+'/3';const xp=num(document.getElementById('xp_atual')?.value,0),prox=XP[lvl]??XP[19];const ni=document.getElementById('nivel_info');if(ni)ni.innerHTML=lvl>=20?`<strong>Nível 20</strong> — máximo da progressão. XP: ${xp}.`:`<strong>Nível ${lvl}</strong> — ${xp} XP. Próximo nível: ${prox} XP. <div class="progress"><div style="width:${Math.max(0,Math.min(100,((xp-(XP[lvl-1]||0))/Math.max(1,prox-(XP[lvl-1]||0)))*100))}%"></div></div>`;XP.forEach((_,i)=>{const e=document.getElementById('lvl_'+(i+1));if(e)e.textContent=(i+1===lvl?'◀ Atual':'')});}
function atualizarDadosDaTela(){const out={_sistema_id:sistema?.id,_sistema_nome:sistema?.nome,_modo:modo,joias_sem_limite:true,joias:obterJoias(),habilidades_lista:obterHabilidades(),inventario:obterInventario()};document.querySelectorAll('#conteudo input,#conteudo select,#conteudo textarea').forEach(e=>{if(e.dataset.j||e.dataset.h||e.dataset.i)return;if(e.id.startsWith('attr_'))out[e.id]=num(e.value,0);else if(e.type==='checkbox')out[e.id]=e.checked;else if(e.type==='number')out[e.id]=num(e.value,0);else out[e.id]=e.value});out.regras='Elarion: testes 2d10 + modificador vs CD; crítico com duplo 10; falha crítica com duplo 1; 3 Dados de Coração; Inspiração 0–3; PF mínimo 5; TF = CON + VON + Nível; joias ilimitadas.';out.modificadores=ATTR.reduce((o,[a])=>(o[a]=modAttr(out['attr_'+a]??1),o),{});return out}

function enviar(){window.parent.postMessage({type:'cronicas-camelot-ficha-pronta',dados:obter(),modo,sistema_id:sistema?.id},location.origin)}
function carregar(s){sistema=s;config=s.configuracao||{};render()}
window.addEventListener('message',e=>{if(e.origin!==location.origin)return;if(e.data?.type==='cronicas-camelot-carregar-sistema')carregar(e.data.sistema);if(e.data?.type==='cronicas-camelot-carregar-ficha'){dados=e.data.dados||{};modo=e.data.modo||'edicao';if(sistema)render()}});

render();
