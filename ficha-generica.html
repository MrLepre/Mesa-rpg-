<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ficha RPG</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=EB+Garamond:wght@400;600&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#080a0f;--panel:#151821;--gold:#c5a059;--gold2:#f3d075;--text:#e2d9c5;--input:#080a0f;--muted:#9e947f}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0%,#1f2738 0%,var(--bg) 70%);color:var(--text);font-family:'EB Garamond',serif;padding:12px;overflow-x:hidden}.ficha{max-width:1050px;margin:auto;border:2px solid var(--gold);background:var(--panel);padding:20px;border-radius:8px;box-shadow:0 0 30px #000}.top{text-align:center;border-bottom:1px solid var(--gold);margin-bottom:18px;padding-bottom:12px}.top h1{font-family:Cinzel;color:var(--gold2);margin:0;font-size:2em}.top p{margin:5px 0;color:#e6ca88}.bloco{border:1px solid #403522;padding:14px;margin-bottom:14px;border-radius:6px;background:linear-gradient(135deg,rgba(15,18,25,.9),rgba(10,12,17,.98));box-shadow:0 4px 15px rgba(0,0,0,.35)}.bloco h2{font-family:Cinzel;color:var(--gold2);font-size:1.05rem;border-bottom:1px solid #403522;padding-bottom:7px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:10px}.campo{display:grid;gap:4px;margin-bottom:2px;min-width:0}.campo label{color:#e6ca88;font-weight:600}.campo small{color:var(--muted);font-size:.8rem}.campo input,.campo textarea,.campo select{width:100%;background:var(--input);color:#eee;border:1px solid #403522;border-radius:4px;padding:8px;font:inherit}.campo textarea{resize:vertical;min-height:85px}.campo input:focus,.campo textarea:focus,.campo select:focus{outline:none;border-color:var(--gold2);box-shadow:0 0 7px rgba(243,208,117,.25)}.checkbox{display:flex;align-items:center;gap:7px;background:var(--input);padding:9px;border:1px solid #403522;border-radius:4px}.checkbox input{width:auto}.calculado input{border-color:#6f5b2d;color:var(--gold2);font-weight:700}.recurso{display:grid;grid-template-columns:1fr auto;gap:7px;align-items:end}.recurso-max{max-width:90px}.campo-roll{display:flex;gap:6px}.campo-roll button{background:#211c12;color:var(--gold2);border:1px solid var(--gold);border-radius:4px;padding:6px 9px;cursor:pointer}.acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.acoes button{padding:10px 14px;background:#211c12;color:var(--gold2);border:1px solid var(--gold);border-radius:5px;font-weight:700;cursor:pointer}.vazio{opacity:.7;text-align:center;padding:20px}.span-2{grid-column:span 2}.span-3{grid-column:span 3}.span-4{grid-column:span 4}@media(max-width:700px){.ficha{padding:12px}.top h1{font-size:1.5em}.grid{grid-template-columns:1fr!important}.span-2,.span-3,.span-4{grid-column:auto}}
</style>
<style>
.bloco-trion{border-color:#1b79a8;background:linear-gradient(135deg,rgba(7,24,36,.96),rgba(9,15,22,.98))}.trion-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.trion-card{padding:12px;border:1px solid #1e4f68;border-radius:6px;background:#08141e;text-align:center}.trion-card span{display:block;font-size:.78rem;color:#9ec8dd}.trion-card strong{display:block;font-size:1.5rem;color:#69d3ff;margin-top:3px}.trion-card.destaque{border-color:#39b8ff;box-shadow:0 0 12px rgba(57,184,255,.12)}.acoes-trion{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.acoes-trion button{background:#0c2433;color:#bdeaff;border:1px solid #2d91bd;border-radius:5px;padding:8px 10px;cursor:pointer;font:inherit}.acoes-trion button:hover{border-color:#69d3ff}.bloco-trion small{color:#8aaaba}.wt-loadout{margin-top:14px;padding-top:12px;border-top:1px solid #1e4f68}.wt-loadout-head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.wt-loadout-head strong{color:#69d3ff}.wt-slots{color:#9ec8dd;font-size:.82rem}.wt-trigger-table{margin-top:12px;border:1px solid #1e4f68;border-radius:6px;overflow:hidden;background:#071018}.wt-trigger-row{display:grid;grid-template-columns:minmax(220px,1fr) 90px 90px;align-items:center;border-top:1px solid #19394b;min-height:52px}.wt-trigger-row:first-child{border-top:0}.wt-trigger-row.head{background:#0b1d29;border-top:0;color:#9ec8dd;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}.wt-trigger-cell{padding:9px 10px;min-width:0}.wt-trigger-cell.side{text-align:center}.wt-trigger-check{width:20px;height:20px;accent-color:#39b8ff;cursor:pointer;display:inline-block;vertical-align:middle}.wt-trigger-name b{display:block;color:#e7f6ff}.wt-trigger-name small{display:block;margin-top:2px;color:#8aaaba;font-size:.78rem}.wt-trigger-side-label{font-weight:700;color:#e6ca88}.wt-loadout-note{margin-top:8px;color:#8aaaba;font-size:.8rem}.wt-loadout-alert{color:#ffca70;font-size:.82rem;margin-top:7px}@media(max-width:700px){.wt-trigger-row{grid-template-columns:minmax(0,1fr) 58px 58px}.wt-trigger-cell{padding:7px 6px}}@media(max-width:700px){.trion-grid{grid-template-columns:1fr}}.wt-squad-kit{margin-top:14px;padding-top:12px;border-top:1px solid #1e4f68}.wt-squad-kit-head{display:flex;justify-content:space-between;gap:10px;align-items:end;flex-wrap:wrap}.wt-squad-kit-head strong{color:#69d3ff}.wt-squad-kit-head small{color:#8aaaba}.wt-npc-editor{margin-top:10px;border:1px solid #1e4f68;border-radius:6px;background:#071018;overflow:hidden}.wt-npc-editor summary{cursor:pointer;list-style:none;padding:10px 12px;background:#0b1d29;color:#e7f6ff;font-family:Cinzel,serif;font-weight:700}.wt-npc-editor summary::-webkit-details-marker{display:none}.wt-npc-editor summary:before{content:'▸ ';color:#69d3ff}.wt-npc-editor[open] summary:before{content:'▾ ';}.wt-npc-body{padding:10px}.wt-npc-fields{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px}.wt-npc-fields .campo{margin:0}.wt-npc-triggers{margin-top:10px;border-top:1px solid #19394b;padding-top:9px}.wt-npc-triggers-title{display:flex;justify-content:space-between;gap:8px;color:#9ec8dd;font-size:.8rem;margin-bottom:6px}.wt-npc-trigger-table{border:1px solid #19394b;border-radius:5px;overflow:hidden}.wt-npc-trigger-row{display:grid;grid-template-columns:minmax(180px,1fr) 70px 80px;align-items:center;min-height:34px;border-top:1px solid #142f3e}.wt-npc-trigger-row:first-child{border-top:0}.wt-npc-trigger-row.head{background:#0b1d29;color:#9ec8dd;font-size:.7rem;text-transform:uppercase}.wt-npc-trigger-cell{padding:5px 7px}.wt-npc-trigger-cell.side{text-align:center}.wt-npc-trigger-check{width:17px;height:17px;accent-color:#39b8ff;cursor:pointer}.wt-npc-trigger-name{color:#d7f3ff;font-size:.8rem}.wt-npc-trigger-name small{display:block;color:#7292a2;font-size:.7rem}.wt-npc-alert{color:#ffca70;font-size:.75rem;margin-top:5px}@media(max-width:700px){.wt-npc-fields{grid-template-columns:1fr 1fr}.wt-npc-trigger-row{grid-template-columns:minmax(0,1fr) 55px 65px}}
</style>
</head>
<body>
<div class="ficha" id="ficha"><div class="top"><h1 id="titulo">Sistema RPG</h1><p id="subtitulo">Ficha de personagem</p></div><div id="conteudo"><p class="vazio">Carregando sistema...</p></div><div class="acoes"><button onclick="enviar()">⚔️ Enviar para a Mesa</button><button onclick="salvarLocal()">💾 Salvar rascunho</button><button onclick="window.print()">📜 Imprimir / PDF</button></div></div>
<script>
let sistema=null, config={}, modo='criacao', dadosCarregados=null, sistemaRecebidoDoPai=false;
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function slug(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9_]/g,'_').toUpperCase()}
function catalogo(c){return [...(c.atributos||[]).map((x,i)=>({...x,id:x.id||`atributo_${i}`,grupo:'Atributo',tipo:'numero'})),...(c.recursos||[]).map((x,i)=>({...x,id:x.id||`recurso_${i}`,grupo:'Recurso',tipo:x.tipo||'numero'})),...(c.pericias||[]).map((x,i)=>({...x,id:x.id||`pericia_${i}`,grupo:'Perícia',tipo:'numero'})),...(c.campos||[]).map((x,i)=>({...x,id:x.id||`campo_${i}`,grupo:'Campo',tipo:x.tipo||'texto'}))]}
function valorCampo(id){const e=document.getElementById(id);if(!e)return '';return e.type==='checkbox'?(e.checked?1:0):e.value}
function montarMapaValores(){const mapa={};catalogo(config).forEach(c=>{const v=Number(valorCampo(c.id));const n=Number.isFinite(v)?v:0;mapa[c.id]=n;if(c.sigla)mapa[slug(c.sigla)]=n;mapa[slug(c.nome)]=n});return mapa}
function avaliarFormula(formula){if(!formula)return '';let f=String(formula).replace(/[{}]/g,'');const vals=montarMapaValores();f=f.replace(/\b[A-Za-z_][A-Za-z0-9_]*\b/g,m=>Object.prototype.hasOwnProperty.call(vals,m.toUpperCase())?String(vals[m.toUpperCase()]):'0');if(!/^[0-9+\-*/().\s]+$/.test(f))return '';try{const result=Function('"use strict";return ('+f+')')();return Number.isFinite(result)?Math.round(result*100)/100:''}catch{return ''}}
function atualizarCalculados(){catalogo(config).filter(c=>c.calculado&&c.formula).forEach(c=>{const e=document.getElementById(c.id);if(e){e.value=avaliarFormula(c.formula);e.readOnly=true}})}
function inputCampo(c,dados){const value=dados?.[c.id] ?? c.valor_padrao ?? '';const required=c.obrigatorio?' required':'';const placeholder=esc(c.placeholder||'');const disabled=c.calculado?' readonly':'';
 if(c.tipo==='area') return `<textarea id="${esc(c.id)}" rows="4" placeholder="${placeholder}"${required}>${esc(value)}</textarea>`;
 if(c.tipo==='checkbox') return `<label class="checkbox"><input id="${esc(c.id)}" type="checkbox" ${value?'checked':''}${c.calculado?' disabled':''}> marcado</label>`;
 if(c.tipo==='select') return `<select id="${esc(c.id)}"${required}${c.calculado?' disabled':''}>${(c.opcoes||[]).map(o=>`<option value="${esc(o)}" ${String(o)===String(value)?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
 const max=c.valor_maximo!==''&&c.valor_maximo!=null?` max="${esc(c.valor_maximo)}"`:'';return `<input id="${esc(c.id)}" type="${c.tipo==='numero'?'number':'text'}" value="${esc(value)}" placeholder="${placeholder}"${required}${max}${disabled}>`;
}
function renderizar(c){config=c;const mapa=new Map(catalogo(c).map(x=>[x.id,x]));let html=`<section class="bloco"><h2>📜 Identidade</h2><div class="grid" style="--cols:2"><div class="campo"><label>Nome do Personagem</label><input id="nome" placeholder="Ex.: Sir Lancelot" value="${esc(dadosCarregados?.nome||'')}"></div><div class="campo"><label>Nível</label><input id="nivel" type="number" min="1" value="${esc(dadosCarregados?.nivel||1)}"></div></div></section>`;
 if(worldTriggerAtivo()) html += montarPainelWorldTrigger();
 const secoes=Array.isArray(c.secoes)&&c.secoes.length?c.secoes:[{titulo:'Atributos',icone:'🛡️',colunas:3,campos:(c.atributos||[]).map((x,i)=>x.id||`atributo_${i}`)},{titulo:'Recursos',icone:'❤️',colunas:3,campos:(c.recursos||[]).map((x,i)=>x.id||`recurso_${i}`)},{titulo:'Perícias',icone:'🎯',colunas:2,campos:(c.pericias||[]).map((x,i)=>x.id||`pericia_${i}`)},{titulo:'Registro',icone:'📚',colunas:1,campos:(c.campos||[]).map((x,i)=>x.id||`campo_${i}`)}];
 secoes.forEach(s=>{const campos=(s.campos||[]).map(id=>mapa.get(id)).filter(Boolean).filter(x=>!(worldTriggerAtivo() && (x.id==='triggers_equipados'||String(x.nome||'').toLowerCase()==='triggers equipados')));if(!campos.length)return;html+=`<section class="bloco"><h2>${esc(s.icone||'◆')} ${esc(s.titulo||'Seção')}</h2><div class="grid" style="--cols:${Math.min(4,Math.max(1,Number(s.colunas||1)))}">${campos.map(x=>{const roll=x.rolagem?`<button type="button" onclick="rolarCampo('${esc(x.id)}')">🎲</button>`:'';const cls=x.calculado?'calculado':'';return `<div class="campo ${cls} span-${Math.min(4,Number(x.largura||1))}"><label>${esc(x.nome)}${x.obrigatorio?' *':''}</label>${x.ajuda?`<small>${esc(x.ajuda)}</small>`:''}<div class="campo-roll">${inputCampo(x,dadosCarregados)}${roll}</div></div>`}).join('')}</div></section>`});document.getElementById('conteudo').innerHTML=html;if(worldTriggerAtivo()) limitarSlotsWorldTrigger();document.getElementById('titulo').textContent=sistema.nome;document.getElementById('subtitulo').textContent=(sistema.descricao||'Ficha de personagem')+(modo==='edicao'?' — edição':'');aplicarTema(c.tema||{});atualizarCalculados();if(worldTriggerAtivo())[0,1,2].forEach(limitarSlotsNPCWT);document.querySelectorAll('#conteudo input,#conteudo textarea,#conteudo select').forEach(e=>e.addEventListener('input',atualizarCalculados)); if(worldTriggerAtivo()){document.getElementById('trion_base')?.addEventListener('input',atualizarTrionVisual);document.getElementById('trion_atual')?.addEventListener('input',atualizarTrionVisual); atualizarTrionVisual();}}
function ehWorldTrigger(){return worldTriggerAtivo()}
function worldTriggerAtivo(){const nome=String(sistema?.nome||'').trim().toLowerCase();const mod=config?.modulos||{};return config?.tipo==='world_trigger'||nome.includes('world trigger')||!!(mod.trion?.ativo&&mod.triggers?.ativo)}
const ARSENAL_WORLD_TRIGGER_PADRAO={
 atacantes:[
  {nome:'Kogetsu',categoria:'Atacante',custoBase:1},
  {nome:'Scorpion',categoria:'Atacante',custoBase:1},
  {nome:'Raygust',categoria:'Atacante',custoBase:1}
 ],
 armeiros:[
  {nome:'Asteroid',categoria:'Artilheiro',custo:1,efeito:'Dano bruto puro'},
  {nome:'Hound',categoria:'Artilheiro',custo:2,efeito:'Projéteis seguem o alvo'},
  {nome:'Viper',categoria:'Artilheiro',custo:'2–3',efeito:'Trajetória definida pelo jogador'},
  {nome:'Meteor',categoria:'Artilheiro',custo:3,efeito:'Dano em área'}
 ],
 snipers:[
  {nome:'Lightning',categoria:'Sniper',custo:2,efeito:'Tiro rápido, difícil de evitar'},
  {nome:'Egret',categoria:'Sniper',custo:3,efeito:'Tiro equilibrado'},
  {nome:'Ibis',categoria:'Sniper',custo:4,efeito:'Destruição massiva'}
 ],
 opcionais:[
  {nome:'Shield',categoria:'Opcional',custo:'1–2',efeito:'Cria barreira de Trion'},
  {nome:'Bagworm',categoria:'Opcional',custo:'1 por turno',efeito:'Remove usuário do radar'},
  {nome:'Chameleon',categoria:'Opcional',custo:'2 por turno',efeito:'Invisibilidade total'},
  {nome:'Spider',categoria:'Opcional',custo:2,efeito:'Cria fios no cenário'},
  {nome:'Lead Bullet',categoria:'Opcional',custo:3,efeito:'Projétil que pesa o alvo'},
  {nome:'Thruster',categoria:'Opcional',custo:2,efeito:'Impulso de movimento'},
  {nome:'Bail Out',categoria:'Especial',custo:'especial',efeito:'Retirada automática do combate'}
 ]
};
function obterArsenalWorldTrigger(){
 const fontes=[config?.arsenal,config?.especial?.arsenal,sistema?.configuracao?.arsenal,sistema?.configuracao?.especial?.arsenal];
 const a=fontes.find(x=>x && ['atacantes','armeiros','snipers','opcionais'].some(k=>Array.isArray(x[k])&&x[k].length)) || ARSENAL_WORLD_TRIGGER_PADRAO;
 return [...(a.atacantes||[]),...(a.armeiros||[]),...(a.snipers||[]),...(a.opcionais||[])];
}
function normalizarTriggersSalvosWT(dados){
 const v=dados?.wt_triggers_ativos;
 if(Array.isArray(v)) return v.map(String).filter(Boolean);
 if(typeof v==='string') return v.split(/[,;\n|]+/).map(x=>x.trim()).filter(Boolean);
 const legado=dados?.triggers_equipados;
 if(typeof legado==='string') return legado.split(/[,;\n|]+/).map(x=>x.trim()).filter(Boolean);
 return [];
}
function normalizarLadosSalvosWT(dados){
 const v=dados?.wt_trigger_lados;
 if(v && typeof v==='object') return {principal:Array.isArray(v.principal)?v.principal.map(String):[],secundario:Array.isArray(v.secundario)?v.secundario.map(String):[]};
 const ativos=normalizarTriggersSalvosWT(dados);
 return {principal:ativos.slice(0,4),secundario:ativos.slice(4,8)};
}
function montarSeletorTriggersWorldTrigger(){
 const arsenal=obterArsenalWorldTrigger().filter(t=>String(t.nome||'').toLowerCase()!=='bail out');
 const lados=normalizarLadosSalvosWT(dadosCarregados);
 const principal=new Set(lados.principal.map(x=>x.toLowerCase()));
 const secundario=new Set(lados.secundario.map(x=>x.toLowerCase()));
 return `<div class="wt-loadout"><div class="wt-loadout-head"><strong>⚔️ Trigger Holder</strong><span id="wt-trigger-contador" class="wt-slots">0 / 8 espaços</span></div><div class="wt-loadout-note">Escolha quais Triggers o agente leva. Cada espaço pode receber um Trigger, e o mesmo Trigger pode ser equipado simultaneamente no Lado Principal e no Secundário. Máximo: 4 em cada lado, 8 no total. <strong>Bail Out</strong> é especial e não ocupa espaço.</div><div class="wt-trigger-table"><div class="wt-trigger-row head"><div class="wt-trigger-cell">Trigger</div><div class="wt-trigger-cell side wt-trigger-side-label">Principal</div><div class="wt-trigger-cell side wt-trigger-side-label">Secundário</div></div>${arsenal.map((t,i)=>{const nome=String(t.nome||'');const low=nome.toLowerCase();const custo=t.custo??t.custoBase??'—';const efeito=t.efeito||t.tecnicas?.[0]?.[2]||'';const p=principal.has(low),s=secundario.has(low);return `<div class="wt-trigger-row"><div class="wt-trigger-cell wt-trigger-name"><b>${esc(nome)}</b><small>${esc(t.categoria||'Trigger')} · Custo: ${esc(custo)}${efeito?' · '+esc(efeito):''}</small></div><div class="wt-trigger-cell side"><input type="checkbox" class="wt-trigger-check wt-trigger-principal" data-trigger-name="${esc(nome)}" data-trigger-side="principal" id="wt_p_${i}" ${p?'checked':''} onchange="selecionarLadoTriggerWT(this)"></div><div class="wt-trigger-cell side"><input type="checkbox" class="wt-trigger-check wt-trigger-secundario" data-trigger-name="${esc(nome)}" data-trigger-side="secundario" id="wt_s_${i}" ${s?'checked':''} onchange="selecionarLadoTriggerWT(this)"></div></div>`}).join('')}</div><div id="wt-trigger-alerta" class="wt-loadout-alert"></div></div>`;
}
function selecionarLadoTriggerWT(el){
 const nome=el.dataset.triggerName; const lado=el.dataset.triggerSide;
 limitarSlotsWorldTrigger();
 if(el.checked){const checks=[...document.querySelectorAll(`.wt-trigger-check[data-trigger-side="${lado}"]:checked`)];if(checks.length>4){el.checked=false;alert(`O ${lado==='principal'?'Lado Principal':'Lado Secundário'} já possui 4 Triggers.`);limitarSlotsWorldTrigger();}}
}
function limitarSlotsWorldTrigger(){
 const checks=[...document.querySelectorAll('.wt-trigger-check')];
 const principal=checks.filter(c=>c.dataset.triggerSide==='principal'&&c.checked).length;
 const secundario=checks.filter(c=>c.dataset.triggerSide==='secundario'&&c.checked).length;
 checks.forEach(c=>{if(!c.checked)c.disabled=(c.dataset.triggerSide==='principal'?principal:secundario)>=4;});
 const total=principal+secundario;
 const contador=document.getElementById('wt-trigger-contador');if(contador)contador.textContent=`${total} / 8 espaços`;
 const alerta=document.getElementById('wt-trigger-alerta');if(alerta)alerta.textContent=total>=8?'⚔️ Trigger Holder completo.':(principal>=4||secundario>=4?'Um dos lados está completo (4/4).':'');
}
function obterTriggersSelecionadosWT(){return [...document.querySelectorAll('.wt-trigger-check:checked')].map(e=>e.dataset.triggerName).filter(Boolean)}
function obterLadosTriggersWT(){return {principal:[...document.querySelectorAll('.wt-trigger-principal:checked')].map(e=>e.dataset.triggerName).filter(Boolean),secundario:[...document.querySelectorAll('.wt-trigger-secundario:checked')].map(e=>e.dataset.triggerName).filter(Boolean)}}
function npcDadosBaseWT(i){
 const lista=Array.isArray(dadosCarregados?.wt_squad_npcs)?dadosCarregados.wt_squad_npcs:[];
 const n=lista[i]||{}; const lados=n.trigger_lados||{};
 const ativos=Array.isArray(n.triggers_ativos)?n.triggers_ativos.map(String):[];
 return {nome:String(n.nome||`NPC ${i+1}`),funcao:String(n.funcao||''),trion:Number(n.trion)||0,hp_max:Number(n.hp_max)||50,imagem:String(n.imagem||n.imagem_url||''),principal:Array.isArray(lados.principal)?lados.principal.map(String):ativos.slice(0,4),secundario:Array.isArray(lados.secundario)?lados.secundario.map(String):ativos.slice(4,8)};
}
function montarEditorSquadNPCsWorldTrigger(){
 const arsenal=obterArsenalWorldTrigger().filter(t=>String(t.nome||'').toLowerCase()!=='bail out');
 const npcs=[0,1,2].map(npcDadosBaseWT);
 return `<div class="wt-squad-kit"><div class="wt-squad-kit-head"><div><strong>👥 Kit do Squad — 3 NPCs</strong><small>Todo agente entra no Rank Wars com três NPCs sob seu comando. Você define identidade, função, Triggers e estado tático de cada um.</small></div></div>${npcs.map((n,i)=>{
   const p=new Set(n.principal.map(x=>x.toLowerCase())), s=new Set(n.secundario.map(x=>x.toLowerCase()));
   return `<details class="wt-npc-editor" ${i===0?'open':''}><summary>${esc(n.nome||`NPC ${i+1}`)} <span id="wt_npc_slot_label_${i}" style="float:right;color:#9ec8dd;font-size:.72rem">${n.principal.length+n.secundario.length}/8</span></summary><div class="wt-npc-body"><div class="wt-npc-fields"><div class="campo"><label>Nome do NPC</label><input id="wt_npc_${i}_nome" value="${esc(n.nome)}" placeholder="Ex.: Aoi"></div><div class="campo"><label>Função</label><input id="wt_npc_${i}_funcao" value="${esc(n.funcao)}" placeholder="Atacante"></div><div class="campo"><label>Trion</label><input id="wt_npc_${i}_trion" type="number" min="0" value="${esc(n.trion)}"></div><div class="campo"><label>HP Máximo</label><input id="wt_npc_${i}_hp" type="number" min="1" value="${esc(n.hp_max)}"></div></div><div class="wt-npc-fields" style="margin-top:8px;grid-template-columns:1fr"><div class="campo"><label>Imagem do token (URL opcional)</label><input id="wt_npc_${i}_imagem" value="${esc(n.imagem)}" placeholder="https://... ou imagem da galeria"></div></div><div class="wt-npc-triggers"><div class="wt-npc-triggers-title"><span>⚔️ Trigger Holder do NPC</span><span>Máximo 4 por lado · 8 total · mesmo Trigger pode ocupar os dois lados</span></div><div class="wt-npc-trigger-table"><div class="wt-npc-trigger-row head"><div class="wt-npc-trigger-cell">Trigger</div><div class="wt-npc-trigger-cell side">Principal</div><div class="wt-npc-trigger-cell side">Secundário</div></div>${arsenal.map((t,j)=>{const nome=String(t.nome||''),low=nome.toLowerCase(),custo=t.custo??t.custoBase??'—';return `<div class="wt-npc-trigger-row"><div class="wt-npc-trigger-cell wt-npc-trigger-name"><b>${esc(nome)}</b><small>Custo ${esc(custo)}</small></div><div class="wt-npc-trigger-cell side"><input type="checkbox" class="wt-npc-trigger-check wt-npc-p-${i}" data-npc="${i}" data-side="principal" data-name="${esc(nome)}" ${p.has(low)?'checked':''} onchange="limitarSlotsNPCWT(${i})"></div><div class="wt-npc-trigger-cell side"><input type="checkbox" class="wt-npc-trigger-check wt-npc-s-${i}" data-npc="${i}" data-side="secundario" data-name="${esc(nome)}" ${s.has(low)?'checked':''} onchange="limitarSlotsNPCWT(${i})"></div></div>`}).join('')}</div><div id="wt_npc_alert_${i}" class="wt-npc-alert"></div></div></div></details>`;
 }).join('')}</div>`;
}
function limitarSlotsNPCWT(i){
 const p=[...document.querySelectorAll(`.wt-npc-trigger-check[data-npc="${i}"][data-side="principal"]`)].filter(x=>x.checked).length;
 const s=[...document.querySelectorAll(`.wt-npc-trigger-check[data-npc="${i}"][data-side="secundario"]`)].filter(x=>x.checked).length;
 document.querySelectorAll(`.wt-npc-trigger-check[data-npc="${i}"]`).forEach(x=>{if(x.checked)x.disabled=false;else x.disabled=(x.dataset.side==='principal'?p:s)>=4 || (p+s)>=8;});
 const l=document.getElementById(`wt_npc_slot_label_${i}`);if(l)l.textContent=`${p+s}/8`;
 const a=document.getElementById(`wt_npc_alert_${i}`);if(a)a.textContent=(p+s)>=8?'Trigger Holder completo.':(p>=4||s>=4?'Um dos lados está completo (4/4).':'');
}
function obterSquadNPCsWT(){
 return [0,1,2].map(i=>{
  const principal=[...document.querySelectorAll(`.wt-npc-trigger-check[data-npc="${i}"][data-side="principal"]:checked`)].map(x=>x.dataset.name);
  const secundario=[...document.querySelectorAll(`.wt-npc-trigger-check[data-npc="${i}"][data-side="secundario"]:checked`)].map(x=>x.dataset.name);
  const get=id=>document.getElementById(id)?.value||'';
  return {nome:get(`wt_npc_${i}_nome`).trim()||`NPC ${i+1}`,funcao:get(`wt_npc_${i}_funcao`).trim(),trion:Number(get(`wt_npc_${i}_trion`))||0,hp_max:Number(get(`wt_npc_${i}_hp`))||50,imagem:get(`wt_npc_${i}_imagem`).trim(),triggers_ativos:[...new Set([...principal,...secundario])],trigger_lados:{principal,secundario}};
 });
}
function validarSquadNPCsWT(){
 const npcs=obterSquadNPCsWT();
 const vazios=npcs.filter(n=>!n.nome.trim());
 if(vazios.length)return 'O Squad precisa ter exatamente 3 NPCs com nome.';
 return null;
}
function montarPainelWorldTrigger(){
 if(!worldTriggerAtivo()) return '';
 return `
   <section class="bloco bloco-trion"><h2>🔋 Centro de Trion</h2><div class="trion-grid">
     <div class="trion-card"><span>Resultado base</span><strong id="wt-trion-base">—</strong></div>
     <div class="trion-card"><span>Trion máximo</span><strong id="wt-trion-max">—</strong></div>
     <div class="trion-card destaque"><span>Trion atual</span><strong id="wt-trion-atual">—</strong></div>
   </div>
   <div class="acoes-trion"><button type="button" onclick="gerarTrion()">🎲 Gerar Trion (1d10 + 2)</button><button type="button" onclick="ajustarTrion(-1)">− 1</button><button type="button" onclick="ajustarTrion(1)">＋ 1</button><button type="button" onclick="abrirGastoTrion()">⚡ Gastar Trion</button></div>
   <small>Regra: até 5 Trion por ação; +1 por turno. Gastar 2 ou menos dá +1 no teste; gastar 5 ou mais aplica -1 na próxima ação.</small>
   ${montarSeletorTriggersWorldTrigger()}
   ${montarEditorSquadNPCsWorldTrigger()}
   </section>`;
}
function resumirTriggers(){
 const a=config?.arsenal||{}; const grupos=[...(a.atacantes||[]),...(a.armeiros||[]),...(a.snipers||[]),...(a.opcionais||[])];
 if(!grupos.length)return '<span class="vazio">Nenhum Trigger cadastrado.</span>';
 return grupos.map(t=>{const tecn=t.tecnicas?.length?`<small>${t.tecnicas.map(x=>`${esc(x[0])} (${esc(x[1])})`).join(' · ')}</small>`:`<small>Custo: ${esc(t.custo??t.custoBase??'—')} · ${esc(t.efeito||'')}</small>`;return `<div class="wt-trigger"><b>${esc(t.nome)}</b>${tecn}</div>`}).join('');
}
function atualizarTrionVisual(){
 const base=Number(document.getElementById('trion_base')?.value||0); const max=base*5;
 const maxEl=document.getElementById('trion_maximo'); if(maxEl) maxEl.value=max||'';
 const atualEl=document.getElementById('trion_atual'); if(atualEl){let atual=Number(atualEl.value||0); if(max>0) atual=Math.min(atual||max,max); atualEl.value=atual||'';}
 const b=document.getElementById('wt-trion-base');const m=document.getElementById('wt-trion-max');const a=document.getElementById('wt-trion-atual');
 if(b)b.textContent=base||'—';if(m)m.textContent=max||'—';if(a)a.textContent=Number(document.getElementById('trion_atual')?.value||0);
}
function gerarTrion(){
 if(!ehWorldTrigger())return; const resultado=Math.floor(Math.random()*10)+1+2; const base=document.getElementById('trion_base'); const max=document.getElementById('trion_maximo'); const atual=document.getElementById('trion_atual');
 if(base)base.value=resultado; if(max)max.value=resultado*5; if(atual)atual.value=resultado*5; atualizarTrionVisual(); alert(`🔋 Trion definido: ${resultado} → ${resultado*5}`);
}
function ajustarTrion(delta){const e=document.getElementById('trion_atual');const max=Number(document.getElementById('trion_maximo')?.value||0);if(!e)return;let v=Number(e.value||0)+delta;e.value=Math.max(0,Math.min(max||9999,v));atualizarTrionVisual()}
function abrirGastoTrion(){const maxAcao=Number(config?.modulos?.trion?.limiteAcao||5);const valor=prompt(`Quanto Trion gastar nesta ação? (0–${maxAcao})`);if(valor===null)return;const n=Number(valor);if(!Number.isInteger(n)||n<0||n>maxAcao)return alert(`Escolha um valor entre 0 e ${maxAcao}.`);const e=document.getElementById('trion_atual');const atual=Number(e?.value||0);if(n>atual)return alert('Trion insuficiente.');if(e)e.value=atual-n;atualizarTrionVisual();const efeito=n<=2?'+1 no teste':(n>=5?'-1 na próxima ação':'sem modificador');alert(`⚡ Gastou ${n} Trion. ${efeito}.`)}
function aplicarTema(t){document.documentElement.style.setProperty('--gold',t.corPrimaria||'#c5a059');document.documentElement.style.setProperty('--gold2',t.corPrimaria||'#f3d075');document.documentElement.style.setProperty('--bg',t.corFundo||'#080a0f');document.documentElement.style.setProperty('--panel',t.corPainel||'#151821')}
function obter(){const out={_sistema_id:sistema?.id,_sistema_nome:sistema?.nome,_modo:modo};document.querySelectorAll('#conteudo input,#conteudo textarea,#conteudo select').forEach(e=>{if(e.disabled&&!e.readOnly)return;if(e.id==='triggers_equipados')return;out[e.id]=e.type==='checkbox'?e.checked:e.value});if(worldTriggerAtivo()){out.wt_triggers_ativos=obterTriggersSelecionadosWT();out.wt_trigger_lados=obterLadosTriggersWT();out.wt_squad_npcs=obterSquadNPCsWT();}return out;}
function resolverRolagem(expr){const vals=montarMapaValores();return String(expr||'').replace(/\b[A-Za-z_][A-Za-z0-9_]*\b/g,m=>Object.prototype.hasOwnProperty.call(vals,m.toUpperCase())?String(vals[m.toUpperCase()]):m)}
function rolarCampo(id){const c=catalogo(config).find(x=>x.id===id);if(!c?.rolagem)return;const expr=resolverRolagem(c.rolagem);window.parent.postMessage({type:'cronicas-camelot-rolar-expressao',expressao:expr,descricao:`${sistema.nome}: ${c.nome}`},location.origin)}
function enviar(){window.parent.postMessage({type:'cronicas-camelot-ficha-pronta',dados:obter(),modo, sistema_id:sistema?.id},location.origin)}
function salvarLocal(){localStorage.setItem('ficha_rpg_rascunho_'+(sistema?.id||'generico'),JSON.stringify(obter()));alert('💾 Rascunho salvo neste dispositivo.');}
async function carregarSistemaRecebido(data){
  if(!data) return;
  sistemaRecebidoDoPai=true;
  sistema=data;
  config=data.configuracao||{};
  renderizar(config);
}

async function iniciar(){
  const p=new URLSearchParams(location.search);
  const id=p.get('sistema');
  modo=p.get('modo')||'criacao';
  if(!id){document.getElementById('conteudo').innerHTML='<p class="vazio">Nenhum sistema foi informado.</p>';return}

  // A ficha recebe o sistema do documento-pai quando aberta pela mesa.
  // Isso evita depender de uma segunda sessão/RLS do Supabase dentro do iframe.
  const sb=window.supabase.createClient('https://rolrbrtpqbchyxmjmvzr.supabase.co','sb_publishable_mJmFjELKk4O1HCTzoKxDdw_EWaiv4j1');
  const r=await sb.from('sistemas').select('*').eq('id',id).maybeSingle();
  if(!sistemaRecebidoDoPai && !r.error && r.data){
    await carregarSistemaRecebido(r.data);
  } else if(!sistemaRecebidoDoPai) {
    document.getElementById('conteudo').innerHTML='<p class="vazio">Carregando configuração do sistema...</p>';
  }
}

window.addEventListener('message',e=>{
  if(e.origin!==location.origin) return;
  if(e.data?.type==='cronicas-camelot-carregar-sistema'){
    carregarSistemaRecebido(e.data.sistema);
    return;
  }
  if(e.data?.type==='cronicas-camelot-carregar-ficha'){
    dadosCarregados=e.data.dados||{};
    modo=e.data.modo||'edicao';
    if(sistema) renderizar(config);
  }
});

iniciar();
</script></body></html>
