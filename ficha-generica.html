<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ficha RPG</title><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=EB+Garamond:wght@400;600&display=swap" rel="stylesheet"><style>body{margin:0;background:#080a0f;color:#e2d9c5;font-family:'EB Garamond',serif;padding:12px}.ficha{max-width:1000px;margin:auto;border:2px solid #c5a059;background:#151821;padding:20px;border-radius:8px;box-shadow:0 0 30px #000}.top{text-align:center;border-bottom:1px solid #c5a059;margin-bottom:18px}.top h1{font-family:Cinzel;color:#f3d075;margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.bloco{border:1px solid #403522;padding:12px;border-radius:6px;background:#0d1018}.bloco h2{font-family:Cinzel;color:#f3d075;font-size:1rem}.campo{display:grid;gap:4px;margin-bottom:8px}.campo label{color:#e6ca88}.campo input,.campo textarea{width:100%;box-sizing:border-box;background:#080a0f;color:#eee;border:1px solid #403522;border-radius:4px;padding:8px;font:inherit}.acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.acoes button{padding:9px 14px;background:#211c12;color:#f3d075;border:1px solid #c5a059;border-radius:5px;font-weight:700;cursor:pointer}@media(max-width:600px){.ficha{padding:12px}.grid{grid-template-columns:1fr}}</style></head><body><div class="ficha"><div class="top"><h1 id="titulo">Sistema RPG</h1><p id="subtitulo">Ficha de personagem</p></div><div id="conteudo"></div><div class="acoes"><button onclick="enviar()">⚔️ Enviar para a Mesa</button><button onclick="window.print()">📜 Imprimir / PDF</button></div></div><script>
let sistema=null;const dados={};
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function campo(id,nome,tipo='texto'){return `<div class="campo"><label>${esc(nome)}</label>${tipo==='area'?`<textarea id="${id}" rows="4"></textarea>`:`<input id="${id}" type="${tipo==='numero'?'number':'text'}">`}</div>`}
async function iniciar(){const p=new URLSearchParams(location.search),id=p.get('sistema');if(!id)return;const url='https://rolrbrtpqbchyxmjmvzr.supabase.co';const key='sb_publishable_mJmJfELKk4O1HCTzoKxDdw_EWaiv4j1';const sb=window.supabase.createClient(url,key);const r=await sb.from('sistemas').select('*').eq('id',id).single();if(r.error)return document.getElementById('conteudo').innerHTML='<p>Sistema não encontrado.</p>';sistema=r.data;const c=sistema.configuracao||{};document.getElementById('titulo').textContent=sistema.nome;let html='<div class="bloco"><h2>📜 Identidade</h2><div class="grid">'+campo('nome','Nome do Personagem')+campo('nivel','Nível','numero')+'</div></div>';if((c.atributos||[]).length)html+='<div class="bloco"><h2>🛡️ Atributos</h2><div class="grid">'+c.atributos.map((x,i)=>campo('atributo_'+i,x.nome,'numero')).join('')+'</div></div>';if((c.recursos||[]).length)html+='<div class="bloco"><h2>❤️ Recursos</h2><div class="grid">'+c.recursos.map((x,i)=>campo('recurso_'+i,x.nome,x.tipo||'numero')).join('')+'</div></div>';if((c.pericias||[]).length)html+='<div class="bloco"><h2>🎯 Perícias</h2><div class="grid">'+c.pericias.map((x,i)=>campo('pericia_'+i,x.nome,'numero')).join('')+'</div></div>';if((c.campos||[]).length)html+='<div class="bloco"><h2>📚 Registro</h2>'+c.campos.map((x,i)=>campo('campo_'+i,x.nome,x.tipo||'texto')).join('')+'</div>';document.getElementById('conteudo').innerHTML=html;}
function obter(){const out={_sistema_id:sistema?.id,_sistema_nome:sistema?.nome};document.querySelectorAll('#conteudo input,#conteudo textarea').forEach(e=>out[e.id]=e.value);return out}
function enviar(){window.parent.postMessage({type:'cronicas-camelot-ficha-pronta',dados:obter(),modo:'criacao'},location.origin)}
iniciar();
</script></body></html>
