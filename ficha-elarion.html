<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Elarion — Ficha</title><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=EB+Garamond:wght@400;600&display=swap" rel="stylesheet"><style>
:root{--bg:#09080b;--panel:#17121b;--gold:#c89b3c;--gold2:#f0cf78;--violet:#9d6cff;--text:#eee4d2;--muted:#aaa0b1;--line:#49372a}*{box-sizing:border-box}body{margin:0;padding:12px;background:radial-gradient(circle at 50% 0,#302039 0,var(--bg) 62%);color:var(--text);font-family:'EB Garamond',serif}.ficha{max-width:1100px;margin:auto;background:rgba(15,12,19,.97);border:2px solid var(--gold);border-radius:9px;padding:18px;box-shadow:0 0 35px #000}.top{text-align:center;border-bottom:1px solid var(--gold);padding-bottom:12px;margin-bottom:15px}.top h1{font-family:Cinzel;color:var(--gold2);margin:0;font-size:2rem}.top p{margin:5px;color:#d7b66a}.bloco{border:1px solid var(--line);border-radius:7px;background:linear-gradient(135deg,#1b1521,#100d14);padding:13px;margin-bottom:13px}.bloco h2{font-family:Cinzel;color:var(--gold2);font-size:1.05rem;border-bottom:1px solid var(--line);padding-bottom:7px;margin:0 0 11px}.grid{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:9px}.campo{min-width:0}.campo label{display:block;color:#e5c77e;font-weight:600;margin-bottom:4px}.campo input,.campo select,.campo textarea{width:100%;padding:8px;background:#09080c;color:#f4f0e9;border:1px solid #4b3c2c;border-radius:4px;font:inherit}.campo input:focus,.campo select:focus,.campo textarea:focus{outline:none;border-color:var(--gold2);box-shadow:0 0 7px #c89b3c33}.attr{display:grid;grid-template-columns:1fr 70px;gap:6px;align-items:end}.attr input{font-weight:700;text-align:center}.mini{font-size:.8rem;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{padding:10px;border:1px solid #4b3c2c;border-radius:6px;text-align:center;background:#0c0a0f}.stat span{display:block;color:var(--muted);font-size:.8rem}.stat strong{font-size:1.45rem;color:var(--gold2)}.joias{display:grid;gap:8px}.joia{display:grid;grid-template-columns:1.1fr .8fr .8fr 1.5fr auto;gap:6px;align-items:end;padding:9px;border:1px solid #4b3c2c;border-radius:6px;background:#0c0a0f}.joia label{font-size:.72rem;color:var(--muted);display:block;margin-bottom:3px}.joia input,.joia select{width:100%;padding:7px;background:#08070a;color:#eee;border:1px solid #403326;border-radius:4px;font:inherit}.btn{background:#21190e;color:var(--gold2);border:1px solid var(--gold);border-radius:5px;padding:8px 11px;font-weight:700;cursor:pointer}.btn:hover{filter:brightness(1.15)}.btn-danger{border-color:#8c4545;color:#ffb1a9;background:#211010}.acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.nota{padding:9px 11px;border-left:3px solid var(--violet);background:#120e19;color:#cfc5d7;border-radius:4px}.sem-limite{color:#9fe0b4;font-weight:700}.pontos{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pontos input{max-width:90px}.checkrow{display:flex;gap:8px;align-items:center;padding:8px;background:#0b090e;border:1px solid #403326;border-radius:4px}.checkrow input{width:auto}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.joia{grid-template-columns:1fr 1fr}.joia .wide{grid-column:1/-1}}@media(max-width:560px){.ficha{padding:10px}.top h1{font-size:1.45rem}.grid{grid-template-columns:1fr!important}.cards{grid-template-columns:1fr 1fr}.joia{grid-template-columns:1fr}.joia .wide{grid-column:auto}}
</style></head><body><div class="ficha"><div class="top"><h1>💎 Elarion — Sistema de Joias e Luvas</h1><p id="subtitulo">Ficha de personagem</p></div><div id="conteudo">Carregando...</div><div class="acoes"><button class="btn" type="button" onclick="enviar()">⚔️ Enviar para a Mesa</button><button class="btn" type="button" onclick="salvarLocal()">💾 Salvar rascunho</button><button class="btn" type="button" onclick="window.print()">📜 Imprimir / PDF</button></div></div><script>
let sistema=null,config={},modo='criacao',dados={};
const CLASSES=['Espadachim Rúnico','Guardião Prismático','Arqueiro Elemental','Teurgo Cristalino','Sombra Lapidada','Berserker do Núcleo','Bardo da Inspiração','Místico Mentalista','Punho Elemental','Condutor do Núcleo','Avatar do Vazio','Mestre da Luz Interior','Punho da Ruína','Tecedor Temporal'];
const RACAS=['Humano','Elfo','Orc','Khajiit','Lizardmen','Anões','Povo-Fera'];
const XP=[0,100,300,600,1000,1500,2100,2800,3600,4500,5500,6600,7800,9100,10500,12000,13600,15300,17100,19000];
const ATTR=['FOR','CON','AGI','VON','INT','CAR','PER','FÉ'];
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function val(id,def=''){return document.getElementById(id)?.value??def}
function render(){document.getElementById('subtitulo').textContent=(sistema?.descricao||'Sistema de Joias e Luvas')+(modo==='edicao'?' — edição':'');let attrs=ATTR.map(a=>`<div class="campo attr"><label>${a}</label><input id="attr_${a}" type="number" min="1" max="99" value="${esc(dados['attr_'+a]??1)}"></div>`).join('');let joias=Array.isArray(dados.joias)?dados.joias:[];document.getElementById('conteudo').innerHTML=`
<section class="bloco"><h2>📜 Identidade</h2><div class="grid" style="--cols:3"><div class="campo"><label>Nome</label><input id="nome" value="${esc(dados.nome||'')}"></div><div class="campo"><label>Raça</label><select id="raca"><option value="">Selecione</option>${RACAS.map(x=>`<option ${dados.raca===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="campo"><label>Classe / Caminho</label><select id="classe"><option value="">Selecione</option>${CLASSES.map(x=>`<option ${dados.classe===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="campo"><label>Subclasse</label><input id="subclasse" value="${esc(dados.subclasse||'')}"></div><div class="campo"><label>Nível</label><input id="nivel" type="number" min="1" max="20" value="${esc(dados.nivel||1)}" oninput="atualizarNivel()"></div><div class="campo"><label>XP atual</label><input id="xp_atual" type="number" min="0" value="${esc(dados.xp_atual||0)}" oninput="atualizarNivel()"></div></div><div class="nota" id="nivel_info"></div></section>
<section class="bloco"><h2>🛡️ Atributos</h2><div class="grid" style="--cols:4">${attrs}</div><div class="mini">Base: 1 em cada atributo + 12 pontos livres. O limite inicial de atributo é 5 antes de bônus.</div></section>
<section class="bloco"><h2>❤️ Recursos</h2><div class="cards"><div class="stat"><span>Vida (HP)</span><strong id="hp_calc">—</strong></div><div class="stat"><span>Fadiga (PF)</span><strong id="pf_calc">—</strong></div><div class="stat"><span>Fadiga Total (TF)</span><strong id="tf_calc">—</strong></div><div class="stat"><span>Defesa</span><strong id="def_calc">—</strong></div></div><div class="grid" style="--cols:3;margin-top:9px"><div class="campo"><label>Vida atual</label><input id="vida_atual" type="number" value="${esc(dados.vida_atual||'')}"></div><div class="campo"><label>PF atual</label><input id="pf_atual" type="number" value="${esc(dados.pf_atual||'')}"></div><div class="campo"><label>Defesa / Reflexo</label><input id="defesa" type="number" value="${esc(dados.defesa||'')}"></div></div></section>
<section class="bloco"><h2>🧤 Luva de Canalização</h2><div class="grid" style="--cols:3"><div class="campo"><label>Rank da Luva</label><select id="luva_rank"><option>Bronze</option><option>Silver</option><option>Gold</option><option>Mythic</option></select></div><div class="campo"><label>Forma / Evolução</label><input id="luva_forma" value="${esc(dados.luva_forma||'')}" placeholder="Ex.: Fase 2.0"></div><div class="campo"><label>Vontade Bestial</label><select id="vontade_bestial"><option>Não</option><option>Desperta</option><option>Controlada</option><option>Natural e Integrada</option></select></div></div><p class="nota"><span class="sem-limite">∞ Joias sem limite de quantidade.</span> Esta ficha não bloqueia quantidade de joias, vínculo ou entradas. O sistema pode registrar quantas joias o personagem possuir, portar ou canalizar.</p><div class="joias" id="lista-joias"></div><button class="btn" type="button" onclick="adicionarJoia()">＋ Adicionar Joia</button></section>
<section class="bloco"><h2>✨ Regras especiais</h2><div class="grid" style="--cols:2"><div class="checkrow"><input id="bestial_ativa" type="checkbox" ${dados.bestial_ativa?'checked':''}><label for="bestial_ativa">Vontade Bestial ativa</label></div><div class="campo"><label>Dados do Coração</label><input id="dados_coracao" type="number" min="0" max="3" value="${esc(dados.dados_coracao??3)}"></div><div class="campo"><label>Inspiração (0–3)</label><input id="inspiracao" type="number" min="0" max="3" value="${esc(dados.inspiracao??0)}"></div><div class="campo"><label>Rituais / Habilidades desbloqueadas</label><textarea id="habilidades" rows="4">${esc(dados.habilidades||'')}</textarea></div><div class="campo"><label>Equipamentos</label><textarea id="equipamentos" rows="4">${esc(dados.equipamentos||'')}</textarea></div><div class="campo"><label>História / Observações</label><textarea id="historia" rows="4">${esc(dados.historia||'')}</textarea></div></div></section>`;document.getElementById('luva_rank').value=dados.luva_rank||'Bronze';document.getElementById('vontade_bestial').value=dados.vontade_bestial||'Não';renderJoias(joias);document.querySelectorAll('#conteudo input,#conteudo select,#conteudo textarea').forEach(e=>e.addEventListener('input',calcular));calcular();atualizarNivel()}
function renderJoias(lista){const el=document.getElementById('lista-joias');el.innerHTML=lista.map((j,i)=>`<div class="joia"><div><label>Nome da Joia</label><input data-j="${i}" data-k="nome" value="${esc(j.nome||'')}"></div><div><label>Categoria</label><select data-j="${i}" data-k="categoria"><option>Normal</option><option>Ancestral</option><option>Mythic</option></select></div><div><label>Tipo</label><input data-j="${i}" data-k="tipo" value="${esc(j.tipo||'')}"></div><div class="wide"><label>Efeito / Atributos / Combinações</label><input data-j="${i}" data-k="efeito" value="${esc(j.efeito||'')}"></div><button class="btn btn-danger" type="button" onclick="removerJoia(${i})">✕</button></div>`).join('')||'<div class="mini">Nenhuma joia registrada. Você pode adicionar quantas quiser.</div>';lista.forEach((j,i)=>{const s=el.querySelector(`select[data-j="${i}"]`);if(s)s.value=j.categoria||'Normal'});el.querySelectorAll('[data-j]').forEach(x=>x.addEventListener('input',()=>{const i=Number(x.dataset.j);const k=x.dataset.k;const arr=obterJoias();arr[i][k]=x.value;dados.joias=arr}))}
function obterJoias(){return [...document.querySelectorAll('#lista-joias .joia')].map(row=>{const out={};row.querySelectorAll('[data-k]').forEach(x=>out[x.dataset.k]=x.value);return out})}
function adicionarJoia(){dados.joias=obterJoias();dados.joias.push({nome:'',categoria:'Normal',tipo:'',efeito:''});renderJoias(dados.joias)}
function removerJoia(i){dados.joias=obterJoias();dados.joias.splice(i,1);renderJoias(dados.joias)}
function n(id){return Number(document.getElementById(id)?.value||0)}
function calcular(){const con=n('attr_CON'),von=n('attr_VON'),lvl=n('nivel')||1;const tf=con+von+lvl;const pf=Math.max(5,Number(dados.pf_base||5));const hp=Math.max(1,Number(dados.hp_base||10)+con+lvl);document.getElementById('tf_calc').textContent=tf;document.getElementById('pf_calc').textContent=pf;document.getElementById('hp_calc').textContent=hp;document.getElementById('def_calc').textContent=document.getElementById('defesa')?.value||'—'}
function atualizarNivel(){const lvl=Math.min(20,Math.max(1,n('nivel')||1)),xp=n('xp_atual');const atual=XP[lvl-1]??0;const prox=XP[lvl]??XP[19];const texto=lvl>=20?`Nível 20 — máximo da progressão.`:`Nível ${lvl}: ${xp}/${prox} XP para o próximo nível.`;const el=document.getElementById('nivel_info');if(el)el.textContent=texto;calcular()}
function obter(){const out={_sistema_id:sistema?.id,_sistema_nome:sistema?.nome,_modo:modo};document.querySelectorAll('#conteudo input,#conteudo select,#conteudo textarea').forEach(e=>{if(e.id.startsWith('attr_'))out[e.id]=Number(e.value||0);else out[e.id]=e.type==='checkbox'?e.checked:e.value});out.joias=obterJoias();out.regras='Elarion — testes 2d10 + modificador vs CD; 3 Dados do Coração; Inspiração 0–3; PF mínimo 5; TF = CON + VON + Nível';out.joias_sem_limite=true;return out}
function enviar(){window.parent.postMessage({type:'cronicas-camelot-ficha-pronta',dados:obter(),modo,sistema_id:sistema?.id},location.origin)}
function salvarLocal(){localStorage.setItem('ficha_elarion_'+(sistema?.id||'generico'),JSON.stringify(obter()));alert('💾 Rascunho salvo neste dispositivo.')}
function carregar(s){sistema=s;config=s.configuracao||{};render()}
window.addEventListener('message',e=>{if(e.origin!==location.origin)return;if(e.data?.type==='cronicas-camelot-carregar-sistema')carregar(e.data.sistema);if(e.data?.type==='cronicas-camelot-carregar-ficha'){dados=e.data.dados||{};modo=e.data.modo||'edicao';if(sistema)render()}});
const p=new URLSearchParams(location.search);modo=p.get('modo')||'criacao';
</script></body></html>
